openapi: 3.1.0
info:
  title: odo API
  version: 0.1.0
  summary: API-first library access middleware/proxy MVP
  description: Management and configuration for odo happen through documented JSON APIs. The admin UI uses these same APIs.
servers:
  - url: http://127.0.0.1:8080
security: []
paths:
  /api/v1/health:
    get:
      summary: Health check
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Service health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/resources:
    get:
      summary: List resources
      operationId: listResources
      responses:
        "200":
          description: Resource list
          content:
            application/json:
              schema:
                type: object
                required: [resources]
                properties:
                  resources:
                    type: array
                    items:
                      $ref: "#/components/schemas/Resource"
    post:
      summary: Create or update a resource
      operationId: upsertResource
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Resource"
      responses:
        "200":
          description: Upserted resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/resources/{id}:
    get:
      summary: Get one resource
      operationId: getResource
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "404":
          $ref: "#/components/responses/Error"
    put:
      summary: Create or update a resource at the given ID
      operationId: putResource
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Resource"
      responses:
        "200":
          description: Upserted resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    delete:
      summary: Delete a resource
      operationId: deleteResource
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Resource deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResourceResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/resources/validate:
    post:
      summary: Validate and normalize a resource config
      operationId: validateResource
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourceConfig"
      responses:
        "200":
          description: Valid resource config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceValidationResponse"
        "400":
          description: Invalid resource config with validation errors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceValidationResponse"
  /api/v1/config/validate:
    post:
      summary: Validate dropped resource config files without writing to SQLite
      operationId: validateConfig
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Config validation results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigValidationResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/config/import:
    post:
      summary: Import dropped resource config files
      operationId: importConfig
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Config import results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigImportResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/config/revisions:
    get:
      summary: List recent config revisions
      operationId: listConfigRevisions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Recent config revisions
          content:
            application/json:
              schema:
                type: object
                required: [revisions]
                properties:
                  revisions:
                    type: array
                    items:
                      $ref: "#/components/schemas/ConfigRevisionSummary"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/config/revisions/{id}:
    get:
      summary: Get config revision detail
      operationId: getConfigRevision
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Config revision detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigRevisionDetail"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/api-keys:
    get:
      summary: List API keys
      operationId: listAPIKeys
      security:
        - bearerAuth: []
      responses:
        "200":
          description: API key list without token secrets or hashes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyListResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    post:
      summary: Create API key
      operationId: createAPIKey
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/APIKeyCreateRequest"
      responses:
        "201":
          description: Created API key. The token is returned only once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyCreateResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/api-keys/{id}:
    get:
      summary: Get API key metadata
      operationId: getAPIKey
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/APIKeyID"
      responses:
        "200":
          description: API key metadata without token secret or hash
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyDetail"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      summary: Delete API key by revoking it
      operationId: deleteAPIKey
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/APIKeyID"
      responses:
        "200":
          description: Deleted/revoked key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyRevokeResponse"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/api-keys/{id}/rotate:
    post:
      summary: Rotate API key token
      operationId: rotateAPIKey
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/APIKeyID"
      responses:
        "200":
          description: Rotated API key. The new token is returned only once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyRotateResponse"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/api-keys/{id}/revoke:
    post:
      summary: Revoke API key
      operationId: revokeAPIKey
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/APIKeyID"
      responses:
        "200":
          description: Revoked key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyRevokeResponse"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/users:
    get:
      summary: List local users
      operationId: listUsers
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User list without password hashes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    post:
      summary: Create local user
      operationId: createUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreateRequest"
      responses:
        "201":
          description: Created user without password hash
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/users/{id}:
    get:
      summary: Get local user
      operationId: getUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserID"
      responses:
        "200":
          description: User without password hash
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      summary: Update local user metadata, roles, or status
      operationId: patchUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPatchRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/users/{id}/set-password:
    post:
      summary: Set a local user's password and revoke existing sessions
      operationId: setUserPassword
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPasswordRequest"
      responses:
        "200":
          description: Password set
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/users/{id}/disable:
    post:
      summary: Disable a local user and revoke sessions
      operationId: disableUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserID"
      responses:
        "200":
          description: Disabled user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /api/v1/users/{id}/enable:
    post:
      summary: Enable a local user
      operationId: enableUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserID"
      responses:
        "200":
          description: Enabled user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /api/v1/users/{id}/lock:
    post:
      summary: Lock a local user and revoke sessions
      operationId: lockUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserID"
      responses:
        "200":
          description: Locked user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /api/v1/users/{id}/unlock:
    post:
      summary: Unlock a local user
      operationId: unlockUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserID"
      responses:
        "200":
          description: Unlocked user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /api/v1/users/{id}/revoke-sessions:
    post:
      summary: Revoke all browser sessions for a local user
      operationId: revokeUserSessions
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserID"
      responses:
        "200":
          description: Sessions revoked
  /api/v1/auth/saml/providers:
  /api/v1/auth/saml/providers:
    get:
      summary: List SAML providers
      operationId: listSAMLProviders
      security:
        - bearerAuth: []
      responses:
        "200":
          description: SAML provider list
          content:
            application/json:
              schema:
                type: object
                required: [providers]
                properties:
                  providers:
                    type: array
                    items:
                      $ref: "#/components/schemas/SAMLProvider"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    post:
      summary: Create or update a SAML provider
      operationId: upsertSAMLProvider
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SAMLProvider"
      responses:
        "200":
          description: Upserted SAML provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SAMLProvider"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/auth/saml/providers/{id}:
    get:
      summary: Get one SAML provider
      operationId: getSAMLProvider
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: SAML provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SAMLProvider"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      summary: Delete a SAML provider
      operationId: deleteSAMLProvider
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted provider
          content:
            application/json:
              schema:
                type: object
                required: [deleted, id]
                properties:
                  deleted:
                    type: boolean
                  id:
                    type: string
        "404":
          $ref: "#/components/responses/Error"
  /auth/saml/metadata:
    get:
      summary: SAML SP metadata
      operationId: samlMetadata
      security: []
      responses:
        "200":
          description: SAML SP metadata XML
          content:
            application/samlmetadata+xml:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/Error"
  /auth/saml/login:
    get:
      summary: SAML login placeholder
      operationId: samlLogin
      security: []
      responses:
        "501":
          $ref: "#/components/responses/Error"
  /auth/saml/acs:
    post:
      summary: SAML assertion consumer service placeholder
      operationId: samlACS
      security: []
      responses:
        "501":
          $ref: "#/components/responses/Error"
  /api/v1/rules/test-url:
    post:
      summary: Test whether a URL matches an active resource rule
      operationId: testURL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestURLRequest"
      responses:
        "200":
          description: URL match result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchResult"
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/proxy/test-fetch:
    post:
      summary: Fetch a bounded proxy troubleshooting preview
      operationId: proxyTestFetch
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProxyTestFetchRequest"
      responses:
        "200":
          description: Proxy fetch preview or safe denial result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProxyTestFetchResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
  /api/v1/logs/access/recent:
    get:
      summary: List recent privacy-filtered access log entries
      operationId: recentAccessLogs
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Recent in-memory access log entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecentAccessLogsResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/diagnostics/proxy/recent:
    get:
      summary: List recent proxy diagnostics
      operationId: recentProxyDiagnostics
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Recent proxy diagnostics, currently empty in the MVP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecentProxyDiagnosticsResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/diagnostics/missed-rewrites/recent:
    get:
      summary: List recent missed rewrite and referer recovery events
      operationId: recentMissedRewrites
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Recent missed rewrite diagnostics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecentMissedRewriteEventsResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /odo/https/{host}/{path}:
    get:
      summary: Minimal proxy fetch, preferred path form
      description: Preferred local/MVP proxy URL form. Builds a target URL from /odo/https/{host}/{path}, validates and allowlist-checks it, performs a safe outbound GET, streams the upstream response, rewrites allowlisted HTML/CSS links/assets/GET form actions back through /odo, injects a conservative same-origin fetch/XHR shim into proxied HTML when enabled, rewrites safe upstream redirects to local /odo redirects, and uses a server-side per-session cookie jar. Once local users exist this route requires a browser login session by default unless development mode or an explicit anonymous URL rule allows access. Upstream cookies are not passed directly to the browser. Full JavaScript rewriting is not implemented yet.
      operationId: proxyFetch
      security: []
      parameters:
        - name: host
          in: path
          required: true
          schema:
            type: string
          example: www.jstor.org
        - name: path
          in: path
          required: true
          schema:
            type: string
          example: stable/example
      responses:
        "200":
          description: Upstream response body and safe response headers
        "403":
          description: URL is not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchResult"
        "405":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
    post:
      summary: Minimal proxy POST, preferred path form
      description: Forwards a bounded POST body to a safe, allowlisted, proxyable HTTPS target using the server-side session cookie jar. Once local users exist this route requires a browser login session by default unless development mode or an explicit anonymous URL rule allows access. Request bodies are size-limited and are not logged. HTML/CSS responses and safe redirects are rewritten back through Odo.
      operationId: proxyPost
      security: []
      parameters:
        - name: host
          in: path
          required: true
          schema:
            type: string
          example: www.jstor.org
        - name: path
          in: path
          required: true
          schema:
            type: string
          example: search
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: string
          application/json:
            schema: {}
      responses:
        "200":
          description: Upstream response body and safe response headers
        "303":
          description: Safe upstream redirect rewritten to local Odo URL
        "403":
          description: URL is not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchResult"
        "405":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
  /odo:
    get:
      summary: Minimal proxy fetch, query compatibility form
      description: Compatibility form accepting /odo?url=https://www.jstor.org/. Generated proxied links default to /odo/https/{host}/{path} unless APP_PROXY_URL_MODE=query is configured.
      operationId: proxyFetchQuery
      security: []
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
            format: uri
      responses:
        "200":
          description: Upstream response body and safe response headers
        "403":
          description: URL is not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchResult"
        "405":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
    post:
      summary: Minimal proxy POST, query compatibility form
      description: Compatibility POST form accepting /odo?url=https://www.jstor.org/. Generated form actions default to /odo/https/{host}/{path} unless APP_PROXY_URL_MODE=query is configured.
      operationId: proxyPostQuery
      security: []
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
            format: uri
      responses:
        "200":
          description: Upstream response body and safe response headers
        "403":
          description: URL is not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchResult"
        "405":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  parameters:
    APIKeyID:
      name: id
      in: path
      required: true
      schema:
        type: string
      example: key_abc123
    UserID:
      name: id
      in: path
      required: true
      schema:
        type: string
      example: user_abc123
  schemas:
    HealthResponse:
      type: object
      required: [status, time]
      properties:
        status:
          type: string
          examples: [ok]
        time:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    DeleteResourceResponse:
      type: object
      required: [deleted, id]
      properties:
        deleted:
          type: boolean
        id:
          type: string
    Resource:
      $ref: "#/components/schemas/ResourceConfig"
    ResourceConfig:
      type: object
      required: [id, domains]
      properties:
        id:
          type: string
          examples: [jstor]
        name:
          type: string
          description: Backward-compatible display name. New configs should use title.
          examples: [JSTOR]
        title:
          type: string
          examples: [JSTOR]
        status:
          type: string
          enum: [active, disabled, inactive]
          default: active
          examples: [active]
        description:
          type: string
        entry_urls:
          type: array
          items:
            type: string
            format: uri
        http_methods:
          type: array
          items:
            type: string
            enum: [GET, HEAD, POST, PUT, PATCH, OPTIONS, DELETE]
        cookie_policy:
          $ref: "#/components/schemas/CookiePolicy"
        request_header_rules:
          type: array
          items:
            $ref: "#/components/schemas/RequestHeaderRule"
        anonymous_url_rules:
          type: array
          items:
            $ref: "#/components/schemas/AnonymousURLRule"
        content_rewrite_rules:
          type: array
          items:
            $ref: "#/components/schemas/ContentRewriteRule"
        domains:
          type: array
          items:
            $ref: "#/components/schemas/DomainRule"
        compatibility:
          $ref: "#/components/schemas/ResourceCompatibility"
        sample_urls:
          type: array
          items:
            type: string
            format: uri
    DomainRule:
      type: object
      required: [host]
      properties:
        host:
          type: string
          examples: [www.jstor.org]
        behavior:
          type: string
          enum: [proxy, cookie_domain, redirect_only, block, external_allow]
          default: proxy
        include_subdomains:
          type: boolean
        match:
          type: string
          enum: [exact, subdomain]
          default: exact
        role:
          type: string
          enum: [content, asset, api, auth, redirect, cookie, unknown, external, blocked]
          default: content
          examples: [content]
        action:
          type: string
          enum: [proxy, allow, block]
          default: proxy
          examples: [proxy]
        reason:
          type: string
        notes:
          type: string
        rewrite_javascript:
          type: boolean
    CookiePolicy:
      type: object
      properties:
        enabled:
          type: boolean
        jar_scope:
          type: string
          enum: [resource, host]
          default: resource
        allowed_cookie_domains:
          type: array
          items:
            type: string
    RequestHeaderRule:
      type: object
      required: [name, action, phase]
      properties:
        name:
          type: string
          examples: [X-Requested-With]
        action:
          type: string
          enum: [remove, preserve]
        phase:
          type: string
          enum: [request, response]
    AnonymousURLRule:
      type: object
      required: [pattern, behavior]
      properties:
        pattern:
          type: string
          examples: [https://cms-films.economist.com/*]
        behavior:
          type: string
          enum: [allow_public_proxy, block]
        methods:
          type: array
          items:
            type: string
            enum: [GET, HEAD]
        notes:
          type: string
    ContentRewriteRule:
      type: object
      required: [content_types, find, replace]
      properties:
        content_types:
          type: array
          items:
            type: string
        find:
          type: string
        replace:
          type: string
          description: Supports limited tokens such as {proxy_url:https://www.example.com/}, {proxy_http_url:https://www.example.com/}, {proxy_host_suffix}, {proxy_base_url}, and {target_origin}.
    ResourceCompatibility:
      type: object
      properties:
        referer_recovery:
          type: boolean
        js_shim:
          type: boolean
        app_data_recovery:
          type: boolean
        javascript_text_rewriting:
          type: boolean
    ResourceValidationResponse:
      type: object
      required: [valid, warnings, errors, normalized]
      properties:
        valid:
          type: boolean
        warnings:
          type: array
          items:
            type: string
        errors:
          type: array
          items:
            type: string
        normalized:
          $ref: "#/components/schemas/ResourceConfig"
    ConfigValidationResponse:
      type: object
      required: [valid, config_dir, results]
      properties:
        valid:
          type: boolean
        config_dir:
          type: string
        results:
          type: array
          items:
            $ref: "#/components/schemas/ConfigValidationResult"
    ConfigValidationResult:
      type: object
      required: [file, valid, resource_id, errors]
      properties:
        file:
          type: string
        valid:
          type: boolean
        resource_id:
          type: string
        errors:
          type: array
          items:
            type: string
    ConfigImportResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/ConfigImportResult"
    ConfigImportResult:
      type: object
      required: [file, imported]
      properties:
        file:
          type: string
        resource_id:
          type: string
        imported:
          type: boolean
        error:
          type: string
    ConfigRevisionSummary:
      type: object
      required: [id, ts, source, status, summary]
      properties:
        id:
          type: integer
        ts:
          type: string
          format: date-time
        source:
          type: string
          examples: [file-import]
        status:
          type: string
          examples: [applied]
        summary:
          type: string
          examples: [imported=1 errors=0]
    ConfigRevisionDetail:
      allOf:
        - $ref: "#/components/schemas/ConfigRevisionSummary"
        - type: object
          required: [config_json]
          properties:
            config_json:
              type: string
              description: JSON string containing normalized imported resource configs.
    APIKeyCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          examples: [GitHub Actions deploy key]
        scopes:
          type: array
          items:
            type: string
            enum: [admin, resources:read, resources:write, config:read, config:write, diagnostics:read, logs:read, auth:read, auth:write]
          examples:
            - [config:write, config:read]
        expires_at:
          type: string
          format: date-time
    APIKeySummary:
      type: object
      required: [id, name, key_prefix, scopes, status, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        key_prefix:
          type: string
          description: Non-secret token prefix for identification.
          examples: [odo_live_abcd1234]
        scopes:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [active, revoked]
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
    APIKeyDetail:
      allOf:
        - $ref: "#/components/schemas/APIKeySummary"
    APIKeyCreateResponse:
      allOf:
        - $ref: "#/components/schemas/APIKeySummary"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: Full bearer token. Returned only once.
              examples: [odo_live_abc123]
    APIKeyRotateResponse:
      allOf:
        - $ref: "#/components/schemas/APIKeyCreateResponse"
    APIKeyRevokeResponse:
      type: object
      properties:
        revoked:
          type: boolean
        deleted:
          type: boolean
        api_key:
          $ref: "#/components/schemas/APIKeySummary"
    APIKeyListResponse:
      type: object
      required: [api_keys]
      properties:
        api_keys:
          type: array
          items:
            $ref: "#/components/schemas/APIKeySummary"
    User:
      type: object
      description: Local user account metadata. Password hashes are never returned.
      required: [id, username, status, roles, created_at, updated_at]
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: string
          format: email
        display_name:
          type: string
        status:
          type: string
          enum: [active, disabled, locked]
        roles:
          type: array
          items:
            type: string
            enum: [admin, staff, user, test]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_login_at:
          type: string
          format: date-time
        locked_at:
          type: string
          format: date-time
        disabled_at:
          type: string
          format: date-time
    UserCreateRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        display_name:
          type: string
        password:
          type: string
          format: password
          minLength: 8
        roles:
          type: array
          items:
            type: string
            enum: [admin, staff, user, test]
        status:
          type: string
          enum: [active, disabled, locked]
    UserPatchRequest:
      type: object
      properties:
        email:
          type: string
        display_name:
          type: string
        roles:
          type: array
          items:
            type: string
            enum: [admin, staff, user, test]
        status:
          type: string
          enum: [active, disabled, locked]
    UserPasswordRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          format: password
          minLength: 8
    UserListResponse:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/User"
    SAMLProvider:
      type: object
      required: [id, name, entity_id, acs_url]
      properties:
        id:
          type: string
          examples: [campus-shibboleth]
        name:
          type: string
          examples: [Campus Shibboleth]
        status:
          type: string
          enum: [active, disabled]
          default: active
        entity_id:
          type: string
          examples: [https://access.example.edu/auth/saml/metadata]
        acs_url:
          type: string
          examples: [https://access.example.edu/auth/saml/acs]
        metadata_url:
          type: string
        metadata_xml:
          type: string
        sign_authn_requests:
          type: boolean
        require_signed_assertions:
          type: boolean
        require_signed_responses:
          type: boolean
        attribute_mappings:
          type: object
          additionalProperties:
            type: string
        role_mappings:
          type: object
          additionalProperties:
            type: string
        session_ttl_minutes:
          type: integer
          default: 480
        idle_timeout_minutes:
          type: integer
          default: 60
    TestURLRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          examples: [https://www.jstor.org/stable/example]
    ProxyTestFetchRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          examples: [https://www.jstor.org/]
    ProxyTestFetchResponse:
      type: object
      required: [allowed]
      properties:
        allowed:
          type: boolean
        error:
          type: string
        reason:
          type: string
        status:
          type: integer
        target_host:
          type: string
        resource_id:
          type: string
        content_type:
          type: string
        body_preview:
          type: string
        body_preview_truncated:
          type: boolean
        headers:
          type: object
          additionalProperties:
            type: string
    RecentAccessLogsResponse:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/AccessLogEntry"
    RecentProxyDiagnosticsResponse:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items:
            type: object
            additionalProperties: true
    RecentMissedRewriteEventsResponse:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/MissedRewriteEvent"
    MissedRewriteEvent:
      type: object
      required: [ts, method, path, recovered, reason]
      properties:
        ts:
          type: string
          format: date-time
        method:
          type: string
        path:
          type: string
        request_kind:
          type: string
          enum: [document, asset, api, app_data, unknown]
        recovery_action:
          type: string
          enum: [redirected_to_canonical, silently_proxied, denied, not_recovered]
        accept_header_summary:
          type: string
          description: First Accept header media token, truncated for safe diagnostics.
        sec_fetch_dest:
          type: string
        sec_fetch_mode:
          type: string
        canonical_proxy_path:
          type: string
          description: Canonical local proxy path without query string.
        referer_route:
          type: string
          examples: [/odo]
        recovered:
          type: boolean
        recovered_target_host:
          type: string
          examples: [www.jstor.org]
        recovered_path_prefix:
          type: string
          description: Safe recovered target path prefix without query string.
        content_type:
          type: string
        upstream_status:
          type: integer
        reason:
          type: string
    AccessLogEntry:
      type: object
      required: [ts, request_id, remote_ip, method, route, status, bytes, duration_ms]
      properties:
        ts:
          type: string
          format: date-time
        request_id:
          type: string
        remote_ip:
          type: string
        method:
          type: string
        route:
          type: string
        status:
          type: integer
        bytes:
          type: integer
        duration_ms:
          type: integer
        target_host:
          type: string
        resource_id:
          type: string
        rule_host:
          type: string
        rule_match:
          type: string
        decision:
          type: string
        denial_reason:
          type: string
        upstream_status:
          type: integer
    MatchResult:
      type: object
      required: [allowed, reason]
      properties:
        allowed:
          type: boolean
        blocked:
          type: boolean
        host:
          type: string
        resource_id:
          type: string
        rule_host:
          type: string
        rule_match:
          type: string
          enum: [exact, subdomain]
        role:
          type: string
          enum: [content, asset, api, auth, redirect, external, blocked]
        action:
          type: string
          enum: [proxy, allow, block]
        matched_rule:
          $ref: "#/components/schemas/DomainRule"
        reason:
          type: string
